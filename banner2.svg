<div style="flex: 1 1 auto; text-align: center; min-width: 0;">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="60" viewBox="0 0 450 60" style="max-width: 450px; display: inline-block; vertical-align: middle;">
      <defs>
        <clipPath id="typing">
          <rect x="0" y="0" width="0" height="60">
            <animate attributeName="width" values="0;450;450;0" dur="5s" repeatCount="indefinite"/>
          </rect>
        </clipPath>
      </defs>
      <text x="225" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#20B2AA" clip-path="url(#typing)">
        7 на 8, 2 на 1.5 ИТиАБ, вперёд, ура! 🎉
      </text>
    </svg>
</div>
